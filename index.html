<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Multi Language Compiler</title>

    <link
        rel="stylesheet"
        href="style.css?v=10"
    >

    <!-- Python / Pyodide -->
    <script
        src="https://cdn.jsdelivr.net/pyodide/v314.0.3/full/pyodide.js"
    ></script>
</head>

<body>

<div class="app">

    <!-- TOP BAR -->

    <header class="topbar">

        <div class="top-left">

            <div
                class="language-logo"
                id="languageLogo"
            >
                Py
            </div>

            <span
                class="file-name"
                id="fileName"
            >
                main.py
            </span>

        </div>


        <div class="top-center">

            <select
                id="languageSelect"
                class="language-select"
            >
                <option value="python">
                    Python
                </option>

                <option value="javascript">
                    JavaScript
                </option>

                <option value="html">
                    HTML
                </option>

                <option value="css">
                    CSS
                </option>
            </select>

        </div>


        <div class="actions">

            <button
                id="clearBtn"
                class="clear-btn"
                type="button"
            >
                Clear
            </button>


            <button
                id="runBtn"
                class="run-btn"
                type="button"
                disabled
            >
                Loading Python...
            </button>

        </div>

    </header>


    <!-- WORKSPACE -->

    <main class="workspace">

        <!-- LEFT -->

        <section class="editor-panel">

            <div
                class="panel-title"
                id="editorTitle"
            >
                Python Code
            </div>


            <div class="editor-container">

                <div
                    class="line-numbers"
                    id="lineNumbers"
                ></div>


                <textarea
                    id="codeEditor"
                    spellcheck="false"
                    autocomplete="off"
                    autocorrect="off"
                    autocapitalize="off"
                >print("Hello World")</textarea>

            </div>


            <!-- PYTHON INPUT -->

            <div
                class="input-section"
                id="inputSection"
            >

                <div class="input-title">
                    Program Input
                </div>


                <textarea
                    id="programInput"
                    placeholder="input() ব্যবহার করলে এখানে value লিখুন..."
                    spellcheck="false"
                ></textarea>

            </div>

        </section>


        <!-- RIGHT -->

        <section class="output-panel">

            <div
                class="panel-title"
                id="outputTitle"
            >
                Output
            </div>


            <!-- Console Output -->

            <pre
                id="outputConsole"
                class="output-console"
            >Loading Python...</pre>


            <!-- HTML / CSS Preview -->

            <iframe
                id="previewFrame"
                class="preview-frame"
                sandbox="allow-scripts"
                hidden
            ></iframe>

        </section>

    </main>

</div>


<script src="script.js?v=10"></script>

</body>

</html>
