<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Python Compiler</title>

    <link
        rel="stylesheet"
        href="style.css"
    >
</head>


<body>

<div class="app">

    <!-- TOP BAR -->

    <header class="topbar">

        <div class="title">
            <div class="python-logo">Py</div>

            <span>main.py</span>
        </div>


        <div class="actions">

            <button
                id="clearBtn"
                class="clear-btn"
            >
                Clear
            </button>

            <button
                id="runBtn"
                class="run-btn"
            >
                ▶ Run
            </button>

        </div>

    </header>


    <!-- MAIN WORKSPACE -->

    <main class="workspace">


        <!-- LEFT SIDE -->

        <section class="editor-panel">

            <div class="panel-title">
                Python Code
            </div>


            <div class="editor-container">

                <div
                    class="line-numbers"
                    id="lineNumbers"
                ></div>


                <textarea
                    id="codeEditor"
                    spellcheck="false"
                >print("Hello World")</textarea>

            </div>


            <!-- INPUT -->

            <div class="input-section">

                <div class="input-title">
                    Program Input
                </div>


                <textarea
                    id="programInput"
                    placeholder="input() ব্যবহার করলে এখানে value লিখুন..."
                    spellcheck="false"
                ></textarea>

            </div>

        </section>


        <!-- RIGHT SIDE -->

        <section class="output-panel">

            <div class="panel-title">
                Output
            </div>


            <pre
                id="outputConsole"
                class="output-console"
            >Output will appear here...</pre>

        </section>


    </main>

</div>


<script src="script.js?v=1"></script>

</body>

</html>
