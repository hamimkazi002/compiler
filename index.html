<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Python Compiler</title>

    <!-- CSS -->
    <link
        rel="stylesheet"
        href="style.css?v=4"
    >

    <!-- Pyodide -->
    <script
        src="https://cdn.jsdelivr.net/pyodide/v314.0.3/full/pyodide.js"
    ></script>
</head>


<body>

<div class="app">

    <!-- =========================
         TOP BAR
    ========================== -->

    <header class="topbar">

        <div class="title">

            <div class="python-logo">
                Py
            </div>

            <span>
                main.py
            </span>

        </div>


        <div class="actions">

            <button
                id="clearBtn"
                class="clear-btn"
                type="button"
            >
                Clear
            </button>


            <button
                id="runBtn"
                class="run-btn"
                type="button"
                disabled
            >
                Loading Python...
            </button>

        </div>

    </header>


    <!-- =========================
         WORKSPACE
    ========================== -->

    <main class="workspace">


        <!-- =====================
             LEFT SIDE
        ====================== -->

        <section class="editor-panel">


            <div class="panel-title">
                Python Code
            </div>


            <div class="editor-container">


                <!-- LINE NUMBERS -->

                <div
                    class="line-numbers"
                    id="lineNumbers"
                ></div>


                <!-- CODE EDITOR -->

                <textarea
                    id="codeEditor"
                    spellcheck="false"
                    autocomplete="off"
                    autocorrect="off"
                    autocapitalize="off"
                >print("Hello World")</textarea>


            </div>


            <!-- =====================
                 PROGRAM INPUT
            ====================== -->

            <div class="input-section">

                <div class="input-title">
                    Program Input
                </div>


                <textarea
                    id="programInput"
                    placeholder="input() ব্যবহার করলে এখানে value লিখুন..."
                    spellcheck="false"
                ></textarea>

            </div>


        </section>


        <!-- =====================
             RIGHT SIDE
        ====================== -->

        <section class="output-panel">


            <div class="panel-title">
                Output
            </div>


            <pre
                id="outputConsole"
                class="output-console"
            >Loading Python...</pre>


        </section>


    </main>


</div>


<!-- =========================
     COMPILER JAVASCRIPT
========================== -->

<script src="script.js?v=4"></script>


</body>

</html>
